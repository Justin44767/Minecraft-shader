plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

group = 'verity'
version = project.mod_version
repositories { maven { url = 'https://maven.maxhenkel.de/repository/public' }; mavenCentral() }
repositories {
    // The original release supplies its API as a nested jar. Only use it at compile time.
    ivy {
        url = 'https://github.com/LambdAurora/LambDynamicLights/releases/download'
        patternLayout { artifact('v[revision]/[artifact]-[revision].[ext]') }
        metadataSources { artifact() }
        content { includeModule('dev.lambdaurora.lambdynamiclights', 'lambdynamiclights') }
    }
}
configurations { dynamicLightsApiBundle { transitive = false } }
dependencies { dynamicLightsApiBundle 'dev.lambdaurora.lambdynamiclights:lambdynamiclights:4.13.0+26.3@jar' }
def lightsApi = layout.buildDirectory.file('compile-libraries/lambdynamiclights-api-4.13.0+26.3.jar')
def extractLightsApi = tasks.register('extractDynamicLightsApi') {
    inputs.files(configurations.dynamicLightsApiBundle)
    outputs.file(lightsApi)
    doLast {
        def bundle = configurations.dynamicLightsApiBundle.singleFile
        def hash = java.security.MessageDigest.getInstance('SHA-256').digest(bundle.bytes).encodeHex().toString()
        if (hash != 'b7550288423affed86370acd80d064876d7e256f5489461b7ff7941627552ab2') {
            throw new GradleException('Official LambDynamicLights release checksum mismatch')
        }
        new java.util.zip.ZipFile(bundle).withCloseable { zip ->
            def entry = zip.getEntry('META-INF/jars/lambdynamiclights-api-4.13.0+26.3.jar')
            if (entry == null) throw new GradleException('Official release is missing its API jar')
            def output = lightsApi.get().asFile
            output.parentFile.mkdirs()
            zip.getInputStream(entry).withCloseable { stream -> output.bytes = stream.readAllBytes() }
        }
    }
}

loom {
    splitEnvironmentSourceSets()
    mods {
        verity {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    clientCompileOnly files(lightsApi).builtBy(extractLightsApi)
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    implementation project(':core')
    include project(':core')
    compileOnly 'de.maxhenkel.voicechat:voicechat-api:2.6.25'
    implementation 'com.alphacephei:vosk:0.3.45'
    include 'com.alphacephei:vosk:0.3.45'
    implementation 'net.java.dev.jna:jna:5.17.0'
    include 'net.java.dev.jna:jna:5.17.0'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}
tasks.withType(JavaCompile).configureEach { options.release = 25 }
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}
// Development artifact: deliberately distinct from the requested finished release.
tasks.named('jar') { archiveFileName = 'VerityV5-26.3-Fabric-dev.jar' }
tasks.named('jar') { from('THIRD_PARTY_NOTICES.md') }
tasks.named('sourcesJar') { from(project(':core').sourceSets.main.allSource) { into 'core' } }

fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'verity-test'
        enableGameTests = true
        clearRunDirectory = true
    }
}
loom.runs.named('gameTest') {
    vmArg "-Dfabric-api.gametest.report-file=${layout.buildDirectory.file('reports/gametest/results.xml').get().asFile}"
}
tasks.named('runGameTest') {
    doFirst {
        // This is the generated test world's directory, never a user's world or client profile.
        delete(layout.buildDirectory.dir('run/gameTest/world'))
    }
}
